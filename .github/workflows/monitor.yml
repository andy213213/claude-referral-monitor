name: Claude referral monitor

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      test_delivery:
        description: Send a cloud connectivity test to Telegram
        type: boolean
        default: false
      setup_bot:
        description: Configure the Telegram menu and webhook
        type: boolean
        default: false
      webhook_url:
        description: Verified production Telegram webhook URL
        type: string
        default: ''
      verify_bot:
        description: Verify the first webhook setup and connect Telegram
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: referral-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify parsers
        run: npm test
      - name: Scan sources and deliver new passes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEIR_API_KEY: ${{ secrets.WEIR_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TEST_DELIVERY: ${{ inputs.test_delivery }}
          SETUP_BOT: ${{ inputs.setup_bot }}
          BOT_WEBHOOK_URL: ${{ inputs.webhook_url }}
          VERIFY_BOT: ${{ inputs.verify_bot }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ "$VERIFY_BOT" = "true" ]; then
            node verify-bot.mjs
          elif [ "$SETUP_BOT" = "true" ]; then
            node setup-bot.mjs
          elif [ "$TEST_DELIVERY" = "true" ]; then
            node monitor.mjs --test-delivery
          else
            node monitor.mjs
          fi
      - name: Persist delivered codes and daily source status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update monitor state [skip ci]'
            git push
          fi
